name: Vantage
options:
  bundleIdPrefix: com.vantage
  deploymentTarget:
    iOS: "17.0"
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    from: 0.12.0
targets:
  Vantage:
    type: application
    platform: iOS
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
          - Info.plist
          - "*.xcodeproj"
          - build
          - Secrets.swift.example
          - SETUP.md
          - "*.xcconfig"
          - Local.xcconfig.example
          - Models
      # Folder reference: whatever .litertlm is in Models/ ships as Models/<file>, no regenerate needed.
      - path: Models
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: Info.plist
      properties:
        CADisableMinimumFrameDuration: true
        CFBundleDisplayName: Vantage
        NSCameraUsageDescription: "Vantage uses the camera and LiDAR to watch the path ahead and guide you with landmarks."
        NSMicrophoneUsageDescription: "Vantage listens for the wake word and your voice commands."
        NSSpeechRecognitionUsageDescription: "Vantage turns your speech into commands and questions."
        NSMotionUsageDescription: "Vantage uses AirPods head motion so spatial cues stay locked to where you are looking."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          - arkit
    settings:
      base:
        # PRODUCT_BUNDLE_IDENTIFIER and DEVELOPMENT_TEAM come from Signing.xcconfig / Local.xcconfig.
        PRODUCT_NAME: Vantage
        SWIFT_OBJC_BRIDGING_HEADER: Vantage-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Vantage
